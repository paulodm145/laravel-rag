services:
  app:
    build: ./docker/php
    working_dir: /var/www
    volumes:
      - .:/var/www
    ports:
      - "8000:8000"
      - "5173:5173"
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - db
      - redis

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: edital
      POSTGRES_USER: edital
      POSTGRES_PASSWORD: secret
    # 5434 no host porque a 5432 já está ocupada por outro Postgres.
    # Dentro da rede do compose a porta continua sendo 5432, que é o que
    # o DB_PORT do .env usa. Esse mapeamento serve só para acessar o banco
    # de fora, com um cliente gráfico. Pode ser removido sem quebrar nada.
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  pgdata:
